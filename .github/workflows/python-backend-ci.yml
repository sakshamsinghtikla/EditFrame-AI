name: Python backend CI

on:
  push:
    branches:
      - feature/python-backend-rewrite
    paths:
      - "python-backend/**"
      - ".github/workflows/python-backend-ci.yml"
  pull_request:
    paths:
      - "python-backend/**"
      - ".github/workflows/python-backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            python-backend/requirements.txt
            python-backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q
