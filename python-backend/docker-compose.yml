services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: editframe
      POSTGRES_USER: editframe
      POSTGRES_PASSWORD: editframe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U editframe -d editframe"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - editframe_data:/data/editframe
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  worker:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - editframe_data:/data/editframe
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO --concurrency=1

volumes:
  postgres_data:
  redis_data:
  editframe_data:
